<header class="app-header">
  <div class="app-header__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">{{ service.title.charAt(0) }}</span>
      <span class="brand__name">{{ service.title }}</span>
    </div>

    <nav class="primary-nav" aria-label="Primary">
      <button type="button"
              class="nav-bar-link"
              [disabled]="nothingToExport"
              [attr.title]="nothingToExport ? 'Add products and people first' : null"
              (click)="exportAll()"
              data-header-export>Export</button>
      <button type="button"
              class="nav-bar-link nav-bar-link--icon"
              [class.active]="service.show[4]"
              [attr.aria-current]="service.show[4] ? 'page' : null"
              (click)="show(4)"
              aria-label="Settings"
              data-settings-nav>
        <mat-icon aria-hidden="true">settings</mat-icon>
      </button>
    </nav>
  </div>
</header>
